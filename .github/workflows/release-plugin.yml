name: release-plugin

# El tag ES la versión del manifest, SIN prefijo (`0.2.0`): así lo exige el directorio de la
# comunidad de Obsidian, que descarga `main.js`, `manifest.json` y `styles.css` del release
# cuyo tag coincide con el `version` declarado. Los assets van SUELTOS como adjuntos
# binarios (no un zip): es el formato que consumen la tienda y BRAT.
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: write # crear la GitHub Release
  id-token: write # firmar la atestación de provenance del build
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # El plugin importa `@ovaultd/core|crypto|protocol` por `file:../ovaultd/packages/*`:
      # sin el monorepo al lado, `npm ci` no resuelve nada. Se clona y se construye primero
      # (el plugin consume los `dist/`, no las fuentes).
      #
      # OJO: `actions/checkout` con `path: ../ovaultd` NO se puede (el path tiene que estar
      # dentro del workspace): se clona a mano al hermano del workspace, que es donde el
      # `file:../ovaultd/...` del package.json lo espera.
      - name: Clonar el monorepo al lado
        run: git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/kastormdz/ovaultd.git" ../ovaultd

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preflight (tag ↔ manifest ↔ package.json ↔ versions.json)
        run: bash scripts/preflight-release.sh "$GITHUB_REF_NAME"

      - name: Construir el monorepo (los dist del núcleo)
        working-directory: ../ovaultd
        run: |
          npm ci
          npm run build

      - name: Instalar, testear y construir el plugin
        run: |
          npm ci
          npm test
          # El build incluye la puerta anti-Node: si se filtra un builtin, falla acá.
          npm run build

      # Attestation de provenance (recomendada por el propio directorio para plugins):
      # firma que estos binarios salieron de ESTE workflow y ESTE commit.
      - name: Atestiguar el build
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publicar la GitHub Release (assets sueltos)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          vers="${GITHUB_REF_NAME}"
          # Las notas salen del CHANGELOG (misma convención que el server).
          awk -v v="$vers" '
            $0 ~ "^## \\[" v "\\]" { dentro = 1 }
            dentro && /^## \[/ && $0 !~ "^## \\[" v "\\]" { exit }
            dentro { print }
          ' CHANGELOG.md > notas-release.md
          if [ ! -s notas-release.md ]; then
            echo "✗ el CHANGELOG no tiene una sección para $vers" >&2
            exit 1
          fi
          gh release create "$vers" \
            --repo "${{ github.repository }}" \
            --title "oVaultd Plugin v$vers" \
            --notes-file notas-release.md \
            --verify-tag \
            main.js manifest.json styles.css
          echo "── release publicada ──"
          gh release view "$vers" --repo "${{ github.repository }}"
